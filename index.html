<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Princess Legacy</title>
    <script src="https://jsdelivr.net"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { background-color: #050505; color: #f7ebd3; font-family: 'Montserrat', sans-serif; }
        .font-royal { font-family: 'Cinzel', serif; }
        * { -webkit-user-select: none; user-select: none; -webkit-user-drag: none; }
        .gallery-img-container { overflow: hidden; transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .gallery-img-container:hover { transform: scale(1.05); box-shadow: 0 30px 60px rgba(212, 175, 55, 0.2); z-index: 10; }
        .secure-overlay { position: absolute; inset: 0; background: transparent; z-index: 5; }
    </style>
</head>
<body class="overflow-x-hidden" oncontextmenu="return false;">

    <!-- 1. Iconic Landing Screen -->
    <section class="w-screen h-screen flex flex-col items-center justify-center relative px-4 text-center bg-radial from-neutral-900 to-black">
        <div class="absolute inset-0 z-0 opacity-40 bg-cover bg-center" style="background-image: url('photos/iconic.jpg'); filter: blur(2px);"></div>
        <div class="secure-overlay"></div>
        <div class="z-10 max-w-3xl space-y-8 pointer-events-none">
            <h1 class="font-royal text-4xl md:text-7xl font-bold tracking-[0.3em] text-transparent bg-clip-text bg-gradient-to-r from-amber-100 via-yellow-400 to-amber-600 drop-shadow-2xl">MY PRINCESS</h1>
            <p class="italic text-lg md:text-2xl text-amber-200/80 font-light max-w-xl mx-auto">"In your smile, I see something more beautiful than the stars."</p>
            <div class="w-12 h-[1px] bg-amber-500 mx-auto mt-8 animate-bounce"></div>
        </div>
    </section>

    <!-- 2. Chronological Archive -->
    <section class="max-w-7xl mx-auto px-4 md:px-8 py-24">
        <h2 class="font-royal text-2xl md:text-3xl tracking-[0.2em] text-center text-amber-400 mb-16">CHRONOLOGICAL ARCHIVE</h2>
        <div id="timeline-container" class="space-y-20">
            <!-- ছবিগুলো এখানে বছর অনুযায়ী অটো-সাজাবে -->
        </div>
    </section>

    <!-- Lightbox -->
    <div id="lightbox" class="fixed inset-0 bg-black/98 z-50 hidden flex items-center justify-center p-4" onclick="closeLightbox()">
        <div class="secure-overlay"></div>
        <img id="lightbox-img" src="" alt="View" class="max-w-full max-h-[92vh] object-contain rounded border border-amber-950/20 shadow-2xl">
    </div>

    <!-- Updated Footer with Father's Name -->
    <footer class="text-center py-12 border-t border-amber-950/10 font-sans text-amber-700/40 text-xs tracking-widest uppercase">
        Archived with ♥ by Khalid Saifullah for Zunaisha Jannat Mariyam • Protected & Secure
    </footer>

    <script>
        // কড়া প্রোটেকশন (F12, Ctrl+S, Right Click ব্লক)
        document.addEventListener('keydown', function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && (e.keyCode == 85 || e.keyCode == 83))) {
                e.preventDefault();
            }
        });

        const timelineContainer = document.getElementById('timeline-container');

        // রোবটের বানানো JSON ফাইল থেকে ডাটা রিড করা
        async function loadTimelineGallery() {
            try {
                const response = await fetch('photos.json');
                const photos = await response.json();
                
                // বছর অনুযায়ী গ্রুপ করা
                const groups = {};
                photos.forEach(photo => {
                    if (!groups[photo.year]) groups[photo.year] = [];
                    groups[photo.year].push(photo.url);
                });

                // বছরগুলোকে উল্টোভাবে সাজানো (নতুন বছর আগে আসবে)
                const sortedYears = Object.keys(groups).sort((a, b) => b - a);

                sortedYears.forEach(year => {
                    const section = document.createElement('div');
                    section.className = "space-y-6";
                    
                    let gridHTML = '';
                    groups[year].forEach(url => {
                        gridHTML += `
                            <div class="relative gallery-img-container bg-neutral-900/40 p-2 rounded-xl border border-amber-950/10 cursor-pointer" onclick="openLightbox('${url}')">
                                <div class="secure-overlay"></div>
                                <img src="${url}" class="w-full aspect-[3/4] object-cover rounded-lg pointer-events-none" loading="lazy">
                            </div>`;
                    });

                    section.innerHTML = `
                        <div class="flex items-center space-x-4">
                            <h3 class="font-royal text-xl md:text-2xl text-amber-500/90 tracking-widest">${year}</h3>
                            <div class="flex-grow h-[1px] bg-gradient-to-r from-amber-950 to-transparent"></div>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-6">${gridHTML}</div>
                    `;
                    timelineContainer.appendChild(section);
                });
            } catch (error) {
                console.log("No photos found yet or JSON pending.", error);
            }
        }

        function openLightbox(url) {
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox').classList.remove('hidden');
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.add('hidden');
        }

        window.onload = loadTimelineGallery;
    </script>
</body>
</html>
