body {

  background-color: #f7f9fa;

  box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.04);

}
/* =========================================================================
   ✨ PREMIUM TORN PAPER APPS DOCK FOOTER (ছেরা কাগজের স্টাইল)
   ========================================================================= */
.fixed-footer {
  position: fixed;
  bottom: 20px;
  left: 0;
  right: 0;
  margin: 0 auto;
  
  /* Safe adaptive dimension layouts constraints mappings */
  width: 90%;
  max-width: 530px; 
  
  /* Solid soft paper tint profile setup color matrix */
  background: #e2e8f096;
  
  /* 🔥 THE TORN PAPER STROKE EFFECT: 
     Uses dynamic complex polygonal clipping mask engine to generate real organic asymmetric rough torn edges! */
  /* 🔥 ENHANCED DYNAMIC TORN EDGES CLIP-PATH MASK LAYER */
clip-path: polygon(
  0% 8%, 4% 1%, 10% 7%, 16% 0%, 23% 9%, 31% 2%, 39% 8%, 45% 0%, 52% 9%, 
  60% 1%, 67% 7%, 75% 0%, 83% 8%, 91% 1%, 96% 7%, 100% 0%, 
  99% 91%, 95% 99%, 88% 90%, 81% 100%, 73% 92%, 66% 99%, 58% 90%, 50% 100%, 
  41% 91%, 33% 99%, 25% 90%, 18% 100%, 11% 91%, 5% 98%, 0% 89%
);

/* Enhanced shadow depth layer setup for real paper float aesthetic look */
box-shadow: 
  0 12px 28px -8px rgba(120, 110, 90, 0.35), 
  0 3px 8px rgba(0, 0, 0, 0.05);

  
  /* Thin organic soft border shadow simulation */
  border-top: 1px solid rgba(139, 92, 26, 0.15);
  border-bottom: 1px solid rgba(139, 92, 26, 0.15);
  
  padding: 10px 24px; /* Ultra-chikon padding adjustments */
  
  /* Soft layered realistic paper floating drop-shadow distribution metrics */

  
  /* Spacing alignment mappings logic grids row loop layout rules */
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px; 
  z-index: 999999999 !important;
  transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
}

.fixed-footer:hover {
  transform: translateY(-2px);
}

/* Left Content text formatting properties data alignment checks */
.footer-left {
  font-size: 0.76rem;
  font-weight: 700;
  color: #475569;
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap; /* Keeps formatting rows crisp on desktop view monitors */
}

/* Heart pulsing micro-animations calculations matrix */
.footer-left .heart-icon {
  font-size: 0.95rem;
  color: #ef4444;
  animation: dynamicPulse 1.4s infinite ease-in-out;
  display: inline-block;
}

.footer-left span {
  background: linear-gradient(135deg, #1e3a8a, #2563eb);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 800;
}

/* Right Section Link structural layouts settings metrics array */
.footer-right {
  font-size: 0.74rem;
  font-weight: 600;
  color: #64748b;
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}

.developer-link {
  color: #2563eb !important;
  text-decoration: none;
  font-weight: 700;
  padding: 3px 10px; 
  background: rgba(37, 99, 235, 0.05);
  border-radius: 4px; /* Keeps slightly blocky matching torn styles aesthetic look */
  transition: all 0.2s ease;
  display: inline-block;
  border: 1px dashed rgba(37, 99, 235, 0.2); /* Dashed stitch border lines effect */
}

.developer-link:hover {
  background: #2563eb;
  color: #ffffff !important;
}

@keyframes dynamicPulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

/* 📱 IMMUTABLE PHONE SMARTPHONE MOBILE IMMUTABLE RESPONSIVE PRESETS FRAMEWORK */
@media (max-width: 768px) {
  .fixed-footer {
    width: 92% !important;
    max-width: 380px;
    padding: 10px 14px;
    bottom: 16px;
    
    /* Auto text stacked alignment protection workflow layers formatting blocks inside tiny resolutions screens */
    flex-direction: column !important;
    gap: 6px !important;
    text-align: center;
    
    /* Micro responsive scaling adjustments for asymmetric polygon masks on small screen space */
    clip-path: polygon(
      0% 6%, 6% 0%, 15% 4%, 25% 1%, 38% 5%, 50% 2%, 65% 5%, 78% 1%, 88% 5%, 100% 2%,
      98% 94%, 88% 97%, 72% 94%, 55% 98%, 40% 93%, 25% 97%, 12% 94%, 0% 98%
    );
  }
  
  .footer-left, .footer-right {
    white-space: normal !important;
    font-size: 0.78rem;
    justify-content: center;
    width: 100%;
  }
}

    /*

    */

      column-count: 5; /* 5 tracks to pack maximum pictures on laptop screens */
      column-gap: 12px;
      width: 100%;

      .gallery-masonry { column-count: 4; }

    /* 
       ✨ PHOTO FRAME CONTAINER:

      border-radius: 14px; /* Curved edge styles */

      background-color: #f1f5f9;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .photo-wrapper:hover {
      transform: scale(1.03);
      box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.08);
      z-index: 10;
    }

    /* 
       📸 CRISP OVERALL FILL MECHANISM:
       'object-fit: cover' guarantees full-card coverage.

    */

    .card-tall { height: 210px; }
    .card-extra { height: 270px; }

    window.addEventListener('DOMContentLoaded', () => {
      const statusBadge = document.getElementById('app-status');

      if (GITHUB_MODE) {
        statusBadge.textContent = "🌐 Mode: Fetching dynamically from 'photos.json'...";
        fetch('photos.json')
          .then(res => { if (!res.ok) throw new Error(); return res.json(); })
          .then(data => buildTrueWaterfallMasonry(data))
          .catch(() => { statusBadge.textContent = "❌ Error: Could not read 'photos.json' data framework!"; });
      } else {
        statusBadge.textContent = "💻 Mode: Standalone pipeline layout variable snapshot active";
        buildTrueWaterfallMasonry(localDemoJSON);
      }
    });

    function buildTrueWaterfallMasonry(dataPayload) {
      const targetRoot = document.getElementById('gallery-root');
      targetRoot.innerHTML = ''; 
      const segmentMap = {};

      dataPayload.forEach(item => {
        if (!segmentMap[item.year]) segmentMap[item.year] = [];
        segmentMap[item.year].push(item);
      });

      const sortedYears = Object.keys(segmentMap).sort((a, b) => b - a);
      
      // Strict distinct height classes list to scatter sizing variations
      const sizingClasses = ['card-small', 'card-medium', 'card-tall', 'card-extra'];

      sortedYears.forEach((yearKey, sectionIndex) => {
        const yearSectionNode = document.createElement('div');
        yearSectionNode.className = 'year-container';

        const dynamicHeader = document.createElement('h2');
        dynamicHeader.className = 'year-title';
        dynamicHeader.textContent = `Year: ${yearKey}`;
        yearSectionNode.appendChild(dynamicHeader);

        const masonryWrapper = document.createElement('div');
        masonryWrapper.className = 'gallery-masonry';

        segmentMap[yearKey].forEach((photoNode, photoIndex) => {
          const wrapperCard = document.createElement('div');
          
          // Modulus distribution algorithm forces pure random mosaic look scatter
          const appliedSizeClass = sizingClasses[(photoIndex * 3 + sectionIndex * 5) % sizingClasses.length];
          wrapperCard.className = `photo-wrapper ${appliedSizeClass}`;

          const activeImg = document.createElement('img');
          activeImg.src = photoNode.url;
          activeImg.alt = `True Masonry Object Frame - ${yearKey}`;
          activeImg.loading = "lazy";

          wrapperCard.appendChild(activeImg);
          masonryWrapper.appendChild(wrapperCard);
        });

        yearSectionNode.appendChild(masonryWrapper);
        targetRoot.appendChild(yearSectionNode);
      });
    }

// 📄 PURE DYNAMIC SEAMLESS TORN PAPER MASK GENERATOR (100% REAL RANDOMNESS)
// =========================================================================
function injectOrganicTornMask() {
  const footerNode = document.querySelector('.fixed-footer');
  if (!footerNode) return;

  const segmentsCount = 26; // Coordinates complexity controller bounds
  let topPath = "0% 0%";
  let bottomPath = "";

  // 1. Top rough edge coordinates calculations loop tracking matrix
  for (let i = 1; i <= segmentsCount; i++) {
    const xPercentage = (i / segmentsCount) * 100;
    const yRandomOffset = Math.floor(Math.random() * 8); // Random fluctuations between 0% to 8% range values
    topPath += `, ${xPercentage}% ${yRandomOffset}%`;
  }

  // 2. Bottom rough edge coordinates calculations loop rules mapping data variables
  for (let i = segmentsCount; i >= 0; i--) {
    const xPercentage = (i / segmentsCount) * 100;
    const yRandomOffset = 92 + Math.floor(Math.random() * 8); // Random fluctuations between 92% to 100% bounds
    bottomPath += `${xPercentage}% ${yRandomOffset}%`;
    if (i > 0) bottomPath += ", ";
  }

  // Compile final dynamic polygon mask layout settings parameters mapping output keys
  const randomizedPolygon = `polygon(${topPath}, ${bottomPath})`;
  footerNode.style.clipPath = randomizedPolygon;
  footerNode.style.webkitClipPath = randomizedPolygon;
}

// Dom content read runtime mapping layers to trigger automatically on startup
window.addEventListener('DOMContentLoaded', injectOrganicTornMask);
